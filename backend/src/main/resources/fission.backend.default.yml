# FissionMC backend configuration (fission.yml). Written by the backend when the file is missing.
# YAML: a `#` after a space starts a comment, so quote texts that contain it. Unknown keys and wrong types stop the server at start and name the key path.
# Relative paths are relative to this file. The backend's vanilla settings stay in server.properties.

node:
  mode: standalone             # standalone (plain single server) | backend | combined
  # id: backend-a              # this backend's id. Without it the backend generates `backend-xxxxxx` ONCE on its first start, saves it here (or into
  #                            # `.fission-node-id` next to this file) and logs it with the exact line for the master's authorized keys file.
  #                            # Write your own id when the master's regions.* / admin config must name this backend (a generated id is only known after the first start).
  # master: "master-host:25600"  # backend: where the master listens. 127.0.0.1 is THIS container: use the master's address (internal network name/IP or public IP + allocated port)
  # master-public: "<base64>"  # backend: the master's public key (printed by the master / gradlew :master:nodeKeys)
  # security: true             # Ed25519 authentication + encryption of the link (keep on outside tests)
  # direct-connections: false  # backend: false = this server's own Minecraft port (server.properties) is only bound on 127.0.0.1, so players can only come
  #                            # through the master (its login, permissions and player data). true = the port is public like on a normal server.
  # connect-timeout: 300       # backend: seconds to wait for the master at start before giving up (0 = wait for ever)
  # key: fission-node.key      # this node's key file (created if missing)
  # listen: "127.0.0.1:25600"  # combined: TCP listener for more backends
  # authorized: fission-authorized.keys   # combined: allowed backends
  # world-root: .              # combined: worlds the master half serves

# combined mode only: the master half's client listener (same keys as the master's client: section)
# client:
#   listen: "0.0.0.0:25565"
#   online-mode: true
#   enabled: true

# Plugin replication from the master (modes backend only): jars the master has in its plugins folder are installed into this server's plugins folder at boot.
# They are listed in plugins/.fission-managed.txt; jars not listed there are yours and are never changed or deleted.
# plugins:
#   replicate: true            # false = do not pull the master's plugins
#   conflict: local            # a plugin of the same name that you installed yourself: local = yours wins (the master's is skipped), master = the master's wins (yours is renamed to <jar>.fission-shadowed, restored later)

# Debug logging: chatty diagnostics (per-chunk leases, every replicated block, periodic stats). Same as -Dfission.debug / FISSION_DEBUG=1, which force it on. Live: a changed value applies at once.
debug: false

# Flight recorder: a structured trace (JSON lines) of everything this backend does, to reconstruct an incident afterwards. Off = one boolean check per call site, nothing else.
# On: events go to an in-memory ring (last ring-seconds) and to trace/<node>-<date>.jsonl next to this file (rotated at max-file-mb, the 4 newest rotated files are kept).
# -Dfission.trace / FISSION_TRACE=1 force it on. Live: a changed value applies at once. The master's `/fission trace start|stop|dump|mark` also drives this backend.
# See .dev/docs/trace.md
trace:
  enabled: false
  ring-seconds: 300
  max-file-mb: 64
