# FissionMC master configuration (fission.yml). Written by the master when the file is missing.
# YAML: indentation matters, a `#` after a space starts a comment, so QUOTE every text that contains ` #` or starts with `#`
# (MiniMessage templates and hex colours below are quoted for that reason). Unknown keys and values of the wrong type stop the master at start
# and name the key path. Keys left out use the defaults shown here. Relative paths are relative to this file.

node:
  mode: master                 # must be `master` for this process
  listen: "127.0.0.1:25600"    # where the backends connect
  security: true               # Ed25519 authentication of the backends (keep on outside tests)
  key: fission-node.key        # this node's key file (created if missing)
  authorized: fission-authorized.keys   # one line per backend: "<node id> <base64 public key>" (gradlew :master:nodeKeys)
  world-root: .                # directory with the worlds the master serves to the backends

# The listener the players connect to (they connect only to the master)
client:
  listen: "0.0.0.0:25565"
  online-mode: true            # false = offline UUIDs (development only)
  motd: "A FissionMC network"
  max-players: 100
  compression-threshold: 256
  enabled: true

# Admins (operator level 4 on every backend + the master's /fission commands). Names only bootstrap: the first login with that name binds its UUID.
admin:
  players: []                  # e.g. [R4T_2, "35deb110-752a-3928-95c4-cc89250ce08e"]
  bind-names: true

# Chat. Placeholders: {name} {displayname} {uuid} {serverid} ({backend} is the same) {message}. A literal < is written \< in MiniMessage.
chat:
  default: local               # local | global: mode of a player who never used /chat
  format:
    syntax: minimessage        # minimessage | legacy. In minimessage, legacy & codes (&r, &#rrggbb, &c ...) also work inside the template.
  global:
    format: ""                 # empty = the vanilla looking default
    # format: "<#b0d8d8>Global <#759e9e>| &r<head:{uuid}> <#949393>{message}"
    prefix: ""
    suffix: ""
    allow-colors: false        # players may use & codes in their own text (never MiniMessage tags)
    max-length: 256
    timeout-ms: 3000           # how long the master waits for the sender's backend to run the chat events
  local:
    format: ""                 # empty = vanilla rendering on the backend; the master pushes this template to the backends
    # format: "<#b0d8d8>{serverid} <#759e9e>| &r<head:{uuid}> <#949393>{message}"

# Join/leave/move lines. Format text uses & codes with {name} {displayname} {backend}.
messages:
  join: { global: true, format: "" }       # global: false = no line at all; empty format = vanilla's yellow line
  leave: { global: true, format: "" }
  switch: { enabled: false, format: "{name} moved to {backend}" }
  local: { enabled: false }                # true = the backends announce themselves (vanilla per backend)

# Pets and riders travel with a player who switches backend
travel:
  pet-radius: 24               # blocks, 0 = pets stay

# Chunk authority: the master is the canonical chunk store
chunk:
  authority: true              # false = backends generate locally
  deterministic: []            # dimensions generated locally without a lease (void/flat worlds), or `true` for all
  lease-seconds: 60
  stats-interval: 30           # seconds between the [chunks] log lines
  store-dir: chunkstore

playerdata:
  dir: playerdata              # master-owned player files

# Static regions. Without this section every backend owns everything.
# regions:
#   margin: 8                  # hysteresis in blocks at a border
#   border-strip: 1            # chunks around a border generated by the lower backend id
#   ghost-zone: 12             # chunks around a player the owner generates for a neighbouring backend
#   default: backend-a         # owner of dimensions without rules
#   dimensions:                # per dimension a list of half open rectangles that must tile the plane (overlap or hole = the master refuses to start)
#     overworld:
#       - { area: [min, min, 0, max], owner: backend-a }    # [x1, z1, x2, z2], min/max = no limit
#       - { area: [0, min, max, max], owner: backend-b }
#     the_nether:
#       - { owner: backend-a }                              # no area = everything

