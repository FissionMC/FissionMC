name: FissionTest
version: 0.1.0
main: net.fissionmc.testplugin.TestPlugin
api-version: "26.3"
load: STARTUP
commands:
  fissiontest:
    description: test helpers for the scripted runs
    usage: /fissiontest rider <player>|poison <player>|poisonsign <player>|plugincheck
  fissioncheck:
    description: plugin.yml command with alias and permission (plugincheck)
    usage: /fissioncheck
    aliases: [fchk]
    permission: fissiontest.check
permissions:
  fissiontest.check:
    description: may run /fissioncheck
    default: op
  fissiontest.admin:
    description: everything of the test plugin
    default: false
    children:
      fissiontest.check: true
  fissiontest.free:
    description: default true permission
    default: true
