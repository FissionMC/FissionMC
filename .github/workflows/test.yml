name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # The node link, the wire protocol and the master: none of them need Mojang's server jar.
      - name: Unit tests
        run: ./gradlew :protocol:test :net:test :packets:test :master:test --console=plain
